<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="SmartTrack - AI-Based International Travel Monitoring System for CSUCC OIGE">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="SmartTrack">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>SmartTrack</title>
    <link rel="manifest" href="manifest.json">
    <script>
        window.flutterWebSocketDebugUrl = null;
    </script>
    <script src="flutter.js" defer></script>
    <style>
        html {
            height: 100%;
        }
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f8fafc;
            font-family: 'Roboto', sans-serif;
        }
        #app {
            width: 100%;
            height: 100%;
        }
        body.loading #app {
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1a5f3f;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        window.addEventListener('load', function(ev) {
            _flutter.loader.loadEntrypoint({
                serviceWorkerVersion: null,
            }).then(function(engineInitializer) {
                return engineInitializer.initializeEngine();
            }).then(function(appRunner) {
                return appRunner.runApp();
            });
        });
    </script>
</body>
</html>
