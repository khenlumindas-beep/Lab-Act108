name: smarttrack
description: SmartTrack - AI-Based International Travel Monitoring System for CSUCC OIGE
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.1
  
  # State Management
  provider: ^6.0.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # UI Components
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.7
  intl: ^0.19.0
  
  # Charts & Graphs
  fl_chart: ^0.64.0
  
  # File Handling
  file_picker: ^6.0.0
  path_provider: ^2.1.1
  
  # DateTime
  table_calendar: ^3.0.9
  
  # Networking
  connectivity_plus: ^5.0.1
  
  # Local Database
  sqflite: ^2.3.0
  sqlite3: ^2.9.4
  
  # Auth
  flutter_secure_storage: ^9.0.0
  
  # Navigation
  go_router: ^11.0.0
  
  # Notifications
  flutter_local_notifications: ^14.1.1
  
  # Logging
  logger: ^2.0.0
  
  # Loading
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
